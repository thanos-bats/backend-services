version: "3.8"

services:
  realtime_classification_ctrl:
    build:
      context: .
      dockerfile: Dockerfile
    image: iti/certh-m4d/koban/realtime_classification_ctrl:1.0
    container_name: realtime_classification_ctrl
    env_file:
      - .env
    environment:
      # Keycloak reached by its container name on the shared koban network.
      KEYCLOAK_URL: "http://keycloak:8080/koban/auth"
      KEYCLOAK_REALM: "koban"
      # Εσωτερικό Docker DNS για το ML model
      REALTIME_BULLYING_API_URL: "http://koban_bullying:13333/grooming_taxonomy_both"
    ports:
      - "4041:4041"
    restart: unless-stopped

networks:
  # Shared with koban-keycloak, koban-webserver and the other app services.
  default:
    external: true
    name: koban
